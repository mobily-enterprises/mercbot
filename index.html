<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Account App</title>
    <style>
      /* The app's own background at once; the loading message only if opening takes over a second. */
      #startup-shell { position: fixed; inset: 0; padding: 24px; background: #fcfcfc; color: #1c1c1c; font: 16px system-ui, sans-serif; }
      #startup-shell > * { visibility: hidden; animation: startup-reveal 0s 1s forwards; }
      @keyframes startup-reveal { to { visibility: visible; } }
      #startup-shell .placeholder { height: 20px; max-width: 480px; margin: 24px 0; border-radius: 4px; background: #f0f0f0; }
      #startup-shell a { display: inline-flex; align-items: center; min-height: 48px; color: inherit; }
      @media (prefers-color-scheme: dark) { #startup-shell { background: #121212; color: #f5f5f5; } #startup-shell .placeholder { background: #1f1f1f; } }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="startup-shell">
        <p id="startup-status" role="status" aria-live="polite">Loading application…</p>
        <div class="placeholder" aria-hidden="true"></div>
        <div class="placeholder" aria-hidden="true"></div>
        <noscript>JavaScript must be enabled to open this application.</noscript>
        <a href="">Reload page</a>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
